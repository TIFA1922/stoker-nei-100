<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Stoker beheer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#121212;--band:#1e1e1e;--line:#2c2c2c;--fg:#fff;--soft:#ddd;--muted:#aaa;--accent:#3ef0c0;--danger:#ff6b5b;
  --f-display:Anton,Impact,"Arial Narrow Bold",sans-serif;--f-body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
main{max-width:640px;margin:0 auto;padding:28px 16px 48px;display:grid;gap:18px}
h1{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:44px;line-height:.95;margin:0}
h1 small{display:block;font-family:var(--f-body);font-size:14px;text-transform:none;color:var(--muted);margin-top:8px}
.box{background:var(--band);border-radius:8px;padding:16px;display:grid;gap:10px;min-width:0}
label,.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
input{width:100%;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:11px 12px;font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{background:var(--accent);color:#06261e;border:0;border-radius:6px;padding:12px 16px;font:600 15px var(--f-body);cursor:pointer}
.btn.ghost{background:transparent;color:var(--soft);border:1px solid var(--line)}
.btn:disabled{opacity:.6;cursor:default}
.msg{margin:0;font-size:14px;color:var(--danger)}
.msg.ok{color:var(--accent)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.top span{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stats div{background:var(--band);border-radius:8px;padding:12px}
.stats b{display:block;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1}
.stats span{font-size:12px;color:var(--muted)}
.round{display:grid;gap:0}
.round h2{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 0 6px;font-weight:500}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.flip{margin-top:6px;background:none;border:1px solid var(--line);border-radius:999px;color:var(--soft);font:500 12px var(--f-body);padding:4px 10px;cursor:pointer}
.flip:hover{border-color:var(--accent);color:var(--fg)}
.row.r4{grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px}
.row.r5{grid-template-columns:minmax(0,1fr) auto auto auto auto;gap:8px}
.cal{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:6px;color:#4da3ff}
.cal:hover{border-color:#4da3ff}
.cal svg{width:20px;height:20px}
.calbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.calbtns a{display:flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:11px 8px;color:var(--soft);font:600 14px var(--f-body);text-decoration:none}
.calbtns a svg{width:18px;height:18px;color:#4da3ff}
.wa{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:6px;color:#25d366;background:transparent;cursor:pointer;padding:0}
.wa:hover{border-color:#25d366}
.wa svg{width:20px;height:20px}
.wabtn{display:flex;align-items:center;justify-content:center;gap:8px;background:#25d366;color:#062b14;border-radius:6px;padding:12px 16px;font:600 15px var(--f-body);text-decoration:none}
.wabtn svg{width:20px;height:20px}
.row:first-of-type{border-top:0}
.row b{font-weight:600;overflow-wrap:anywhere}
.row small{display:block;color:var(--muted);font-size:12px}
.row .kg{font-family:var(--f-display);font-size:22px}
.del{background:transparent;border:1px solid var(--line);color:var(--danger);border-radius:6px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer}
.del:hover{border-color:var(--danger)}
.del svg{width:20px;height:20px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.tabs button{background:var(--band);color:var(--muted);border:0;border-radius:6px;padding:11px 0;font:500 15px var(--f-body);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:#06261e;font-weight:600}
.offer{background:var(--band);border-radius:8px;padding:14px;display:grid;gap:10px}
.offer b{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.offer span{display:block;font-size:14px;color:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{font-size:12px;font-weight:600;white-space:nowrap}
.st.ja{color:var(--accent)}.st.nee{color:#ffb27a}
.empty{color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:8px;padding:16px}
.kleuren{display:flex;gap:8px;flex-wrap:wrap}
.kleuren button{width:34px;height:34px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 3px var(--bg);cursor:pointer;padding:0}
.kleuren button[aria-pressed="true"]{border-color:var(--fg)}
.dn{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.dn:first-child{border-top:0}
.dn .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#121212;font-weight:600;font-size:13px}
.dn small{display:block;color:var(--muted);font-size:12px}
.dn.uit{opacity:.5}
.mini{background:transparent;border:1px solid var(--line);color:var(--soft);border-radius:6px;height:44px;padding:0 10px;font:600 13px var(--f-body);cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>Stoker beheer<small>Gokken, meisporten en deelnemers beheren</small></h1>

  <form class="box" id="login" autocomplete="on">
    <label for="mail">E-mailadres</label>
    <input id="mail" type="email" autocomplete="username" required>
    <label for="pw">Wachtwoord</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" id="loginBtn">Inloggen</button>
    <p class="msg" id="loginMsg" hidden></p>
  </form>

  <section id="app" hidden style="display:grid;gap:18px">
    <div class="top"><span id="who"></span><button class="btn ghost" type="button" id="logout">Uitloggen</button></div>
    <div class="tabs" role="tablist">
      <button type="button" role="tab" id="tabGok" aria-selected="true" aria-controls="panGok">Gokken</button>
      <button type="button" role="tab" id="tabMei" aria-selected="false" aria-controls="panMei">Meisporten</button>
      <button type="button" role="tab" id="tabDn" aria-selected="false" aria-controls="panDn">Deelnemers</button>
    </div>
    <div id="panGok" role="tabpanel" style="display:grid;gap:18px">
    <div class="stats">
      <div><b id="sTot">0</b><span>gokken</span></div>
      <div><b id="sPeople">0</b><span>deelnemers</span></div>
      <div><b id="sRounds">0</b><span>rondes</span></div>
    </div>
    <div class="box">
      <label for="filter">Zoek op naam</label>
      <input id="filter" type="search" placeholder="bv. test" autocomplete="off">
      <button class="btn ghost" type="button" id="delFiltered" hidden></button>
      <p class="msg" id="appMsg" hidden></p>
    </div>
    <div id="list" style="display:grid;gap:12px"></div>
    </div>
    <div id="panDn" role="tabpanel" hidden style="display:grid;gap:14px">
      <form class="box" id="dnForm" style="display:grid;gap:10px">
        <label for="dnNaam">Nieuwe deelnemer</label>
        <input id="dnNaam" maxlength="30" placeholder="Voornaam, bv. Anne" autocomplete="off" required>
        <button class="btn" type="submit" id="dnAdd">Toevoegen en uitnodigen</button>
      </form>
      <div id="dnWa"></div>
      <div id="dnList" class="box round"></div>
      <p class="msg" id="dnMsg" hidden></p>
      <p style="font-size:13px;color:var(--muted);margin:0">Een deelnemer kiest zelf een wachtwoord en kleur via de link. De link werkt 14 dagen en maar één keer. Wachtwoord vergeten? Stuur een nieuwe link.</p>
    </div>
    <div id="panMei" role="tabpanel" hidden style="display:grid;gap:12px">
      <div id="meiWaTop"></div>
      <span class="lbl">Nieuwe aanbiedingen</span>
      <div id="meiOpen" style="display:grid;gap:8px"></div>
      <span class="lbl">Komende afspraken</span>
      <div id="meiDone" class="box round"></div>
      <span class="lbl">Geweest</span>
      <div id="meiPast" class="box round"></div>
      <p class="msg" id="meiMsg" hidden></p>
      <div id="meiWa"></div>
    </div>
  </section>
</main>
<script>
const SB="https://cupcyeurvttyetfrhuoi.supabase.co", KEY="sb_publishable_piOI9XYSPxKDYEhVl6rYag_lSCzmy3h";
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>Number(n).toLocaleString("nl-NL",{minimumFractionDigits:1,maximumFractionDigits:1});
const M=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const fdt=s=>{const d=new Date(s);return d.getDate()+" "+M[d.getMonth()]+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const fd=s=>{const [y,m,d]=String(s).slice(0,10).split("-");return +d+" "+M[+m-1]+" "+y};
const BIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';

let S=null, rows=[];
try{S=JSON.parse(sessionStorage.getItem("stoker-admin")||"null")}catch(e){}

const say=(id,t,ok)=>{const m=$(id);m.hidden=!t;m.textContent=t||"";m.classList.toggle("ok",!!ok)};
const authH=()=>({apikey:KEY,Authorization:"Bearer "+S.access_token});
const save=()=>{try{S?sessionStorage.setItem("stoker-admin",JSON.stringify(S)):sessionStorage.removeItem("stoker-admin")}catch(e){}};

async function token(body,grant){
  const r=await fetch(SB+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(j.error_description||j.msg||j.message||"Inloggen mislukt");
  S={access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,email:j.user&&j.user.email};
  save();
}
async function fresh(){ if(S&&Date.now()>S.exp-60000) await token({refresh_token:S.refresh_token},"refresh_token"); }

$("login").addEventListener("submit",async e=>{
  e.preventDefault(); $("loginBtn").disabled=true; say("loginMsg","");
  try{ await token({email:$("mail").value.trim(),password:$("pw").value},"password"); $("pw").value=""; show(); }
  catch(err){ say("loginMsg",/invalid/i.test(err.message)?"E-mailadres of wachtwoord klopt niet.":err.message); }
  $("loginBtn").disabled=false;
});
$("logout").addEventListener("click",()=>{ if(S) fetch(SB+"/auth/v1/logout",{method:"POST",headers:authH()}).catch(()=>{}); S=null; save(); show(); });

async function load(){
  try{
    await fresh();
    const r=await fetch(SB+"/rest/v1/gokken?select=id,naam,gok,week,created_at&order=created_at.desc&limit=10000",{headers:authH()});
    if(r.status===401){S=null;save();show();return}
    if(!r.ok) throw 0;
    rows=await r.json(); render(); say("appMsg","");
  }catch(e){ say("appMsg","Laden mislukt. Ververs de pagina en probeer het opnieuw."); }
}
function render(){
  const q=$("filter").value.trim().toLowerCase();
  const vis=q?rows.filter(r=>r.naam.toLowerCase().includes(q)):rows;
  $("sTot").textContent=rows.length;
  $("sPeople").textContent=new Set(rows.map(r=>r.naam.trim().toLowerCase())).size;
  $("sRounds").textContent=new Set(rows.map(r=>String(r.week).slice(0,10))).size;
  const b=$("delFiltered"); b.hidden=!(q&&vis.length); b.textContent="Alle "+vis.length+" gevonden gokken verwijderen";
  if(!vis.length){$("list").innerHTML='<div class="empty">'+(rows.length?"Geen gokken met deze naam.":"Nog geen gokken.")+'</div>';return}
  const g={}; vis.forEach(r=>{const k=String(r.week).slice(0,10);(g[k]=g[k]||[]).push(r)});
  $("list").innerHTML=Object.keys(g).sort().reverse().map(k=>'<div class="box round"><h2>Gegokt na stand van '+fd(k)+' · '+g[k].length+'</h2>'+
    g[k].map(r=>'<div class="row"><div><b>'+esc(r.naam)+'</b><small>'+fdt(r.created_at)+'</small></div><span class="kg">'+fmt(r.gok)+'</span><button class="del" type="button" data-id="'+esc(r.id)+'" aria-label="Gok van '+esc(r.naam)+' verwijderen">'+BIN+'</button></div>').join("")+'</div>').join("");
}
async function del(ids,label){
  if(!ids.length||!confirm(label+" verwijderen? Dit kan niet ongedaan worden."))return;
  try{
    await fresh();
    const r=await fetch(SB+"/rest/v1/gokken?id=in.("+ids.join(",")+")",{method:"DELETE",headers:Object.assign({Prefer:"return=representation"},authH())});
    if(!r.ok) throw 0;
    const gone=await r.json();
    if(!gone.length){ say("appMsg","Niets verwijderd. Heb je de SQL voor de beheerpagina uitgevoerd met jouw e-mailadres?"); return; }
    const set=new Set(gone.map(x=>x.id)); rows=rows.filter(x=>!set.has(x.id)); render();
    say("appMsg",gone.length===1?"Gok verwijderd.":gone.length+" gokken verwijderd.",true);
  }catch(e){ say("appMsg","Verwijderen mislukt. Probeer het opnieuw."); }
}
$("list").addEventListener("click",e=>{const b=e.target.closest(".del");if(!b)return;const r=rows.find(x=>x.id===b.dataset.id);del([b.dataset.id],"De gok van "+(r?r.naam+" ("+fmt(r.gok)+")":"deze persoon"))});
$("filter").addEventListener("input",render);
$("delFiltered").addEventListener("click",()=>{const q=$("filter").value.trim().toLowerCase();const ids=rows.filter(r=>r.naam.toLowerCase().includes(q)).map(r=>r.id);del(ids,ids.length+" gokken met \""+$("filter").value.trim()+"\"")});

// --- meisporten ---
const MEI=SB+"/rest/v1/meisporte";
const WD=["zondag","maandag","dinsdag","woensdag","donderdag","vrijdag","zaterdag"];
const nice=s=>{const [y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1,d);return WD[t.getDay()]+" "+d+" "+M[m-1]};
const isoToday=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
let mei=[];
async function loadMei(){
  try{
    await fresh();
    const r=await fetch(MEI+"?select=*&order=datum.asc&limit=5000",{headers:authH()});
    if(r.status===401){S=null;save();show();return}
    if(!r.ok) throw 0;
    mei=await r.json(); renderMei(); say("meiMsg","");
  }catch(e){ say("meiMsg","Laden mislukt. Heb je de SQL voor meisporten uitgevoerd?"); }
}
const WAI='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';
const FWD=["snein","moandei","tiisdei","woansdei","tongersdei","freed","sneon"], FM=["jannewaris","febrewaris","maart","april","maaie","juny","july","augustus","septimber","oktober","novimber","desimber"];
const fryDate=s=>{const [y,m,d]=s.split("-").map(Number);const t=new Date(y,m-1,d);return FWD[t.getDay()]+" "+d+" "+FM[m-1]};
const dayWord=s=>{const t=new Date();t.setHours(0,0,0,0);const [y,m,d]=s.split("-").map(Number);const diff=Math.round((new Date(y,m-1,d)-t)/864e5);return diff===0?"hjoed":diff===1?"moarn":fryDate(s)};
// wat dogge wy: emoji, namme, "wy geane ..."
const WAT={sporte:["🏋️","Sportskoalle","nei de sportskoalle"],hurdrinne:["🏃","Hurdrinne","hurdrinne"],mtb:["🚵","Mountainbike","mountainbiken"],kuierje:["🚶","Rûntsje kuierje","in rûntsje kuierje"],padel:["🎾","Padel / tennis","padelje"],oars:["✨","Oars","wat oars dwaan"]};
const watFan=x=>WAT[x.wat]||WAT.sporte;
const watNamme=x=>x.wat==="oars"&&x.wat_oars?String(x.wat_oars):watFan(x)[1];
const watDwaan=x=>x.wat==="oars"&&x.wat_oars?String(x.wat_oars).toLowerCase():watFan(x)[2];
const watKoart=x=>watFan(x)[0]+" "+watNamme(x).toLowerCase();
const agindaUrl=x=>{const [a]=slot(x);return "https://stokernei100.nl/aginda.html?d="+x.datum+"&t="+a+"&w="+encodeURIComponent(WAT[x.wat]?x.wat:"sporte")+(x.wat==="oars"&&x.wat_oars?"&o="+encodeURIComponent(x.wat_oars):"")+(x.tiid?"":"&p="+encodeURIComponent(x.dagdiel))};
function waText(x,kind){
  const n=String(x.naam).trim().split(" ")[0], hm=x.tiid?String(x.tiid).slice(0,5):"", when=fryDate(x.datum)+" "+(hm?"om "+hm:x.dagdiel);
  if(kind==="remind") return "Hoi "+n+"! Net ferjitte: "+dayWord(x.datum)+" "+(hm?"om "+hm:x.dagdiel)+" "+"geane wy "+watDwaan(x)+" "+watFan(x)[0]+". Oant dan!\nStoker\n\nYn dyn aginda: "+agindaUrl(x);
  if(x.status==="ja") return "Hoi "+n+"! "+when[0].toUpperCase()+when.slice(1)+": gesellich, "+"wy geane "+watDwaan(x)+"! "+watFan(x)[0]+"\nStoker\n\nSet it yn dyn aginda: "+agindaUrl(x);
  return "Hoi "+n+", "+when+" past it my spitigernôch net. Kies gerust in oare dei op de side: https://stokernei100.nl/\nStoker";
}
const waUrl=(x,kind)=>"https://wa.me/?text="+encodeURIComponent(waText(x,kind));
// agenda: tiden per dieldei (oan te passen yn Outlook)
const SLOT={moarns:["08:00","09:00"],middeis:["13:00","14:00"],"jûns":["19:00","20:00"]};
const calTitle=x=>watNamme(x)+" mei "+String(x.naam).trim();
const plus1=t=>{const [h,m]=t.split(":").map(Number);return String(Math.min(23,h+1)).padStart(2,"0")+":"+String(m).padStart(2,"0")};
const slot=x=>x.tiid?[String(x.tiid).slice(0,5),plus1(String(x.tiid).slice(0,5))]:(SLOT[x.dagdiel]||SLOT["jûns"]);
const outlookUrl=x=>{const [a,b]=slot(x);return "https://outlook.office.com/calendar/0/deeplink/compose?path=%2Fcalendar%2Faction%2Fcompose&rru=addevent"+
  "&subject="+encodeURIComponent(calTitle(x))+"&startdt="+x.datum+"T"+a+":00&enddt="+x.datum+"T"+b+":00"+
  "&body="+encodeURIComponent(x.tiid?"Ofspraak fia Stoker nei 100.":"Ofspraak fia Stoker nei 100. Tiid is in skatting ("+x.dagdiel+"), pas oan as it nedich is.")};
function icsUrl(x){
  const [a,b]=slot(x), d=x.datum.replace(/-/g,""), t=v=>v.replace(":","")+"00";
  const now=new Date().toISOString().replace(/[-:]/g,"").slice(0,15)+"Z";
  const ics=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Stoker nei 100//NL","BEGIN:VEVENT","UID:"+x.id+"@stoker-nei-100","DTSTAMP:"+now,
    "DTSTART:"+d+"T"+t(a),"DTEND:"+d+"T"+t(b),"SUMMARY:"+calTitle(x),"DESCRIPTION:Ofspraak fia Stoker nei 100 ("+x.dagdiel+")",
    "BEGIN:VALARM","TRIGGER:-PT1H","ACTION:DISPLAY","DESCRIPTION:"+calTitle(x),"END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  return "data:text/calendar;charset=utf-8,"+encodeURIComponent(ics);
}
const CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/></svg>';
function renderMei(){
  const today=isoToday();
  const open=mei.filter(x=>x.status==="wacht"&&x.datum>=today);
  const done=mei.filter(x=>x.status!=="wacht"&&x.datum>=today);
  const past=mei.filter(x=>x.datum<today).reverse();
  $("tabMei").textContent="Meisporten"+(open.length?" · "+open.length:"");
  $("meiOpen").innerHTML=open.length?open.map(x=>'<div class="offer"><div><b>'+esc(x.naam)+'</b><span>'+nice(x.datum)+' · '+esc(x.dagdiel)+(x.tiid?' '+esc(String(x.tiid).slice(0,5)):'')+' · '+esc(watKoart(x))+'</span></div><div class="two"><button class="btn" type="button" data-set="ja" data-id="'+esc(x.id)+'">Ja, gezellig!</button><button class="btn ghost" type="button" data-set="nee" data-id="'+esc(x.id)+'">Past niet</button></div></div>').join(""):'<div class="empty">Geen nieuwe aanbiedingen.</div>';
  const row=(x,wa)=>'<div class="row'+(wa?(x.status==="ja"?' r5':' r4'):'')+'"><div><b>'+esc(x.naam)+'</b><small>'+nice(x.datum)+' · '+esc(x.dagdiel)+(x.tiid?' '+esc(String(x.tiid).slice(0,5)):'')+' · '+esc(watKoart(x))+'</small>'+(wa?'<button type="button" class="flip" data-set="'+(x.status==='ja'?'nee':'ja')+'" data-id="'+esc(x.id)+'">'+(x.status==='ja'?'Toch niet':'Past toch wel')+'</button>':'')+'</div><span class="st '+esc(x.status)+'">'+({ja:"Afgesproken",nee:"Past niet",wacht:"Niet beantwoord"}[x.status]||"")+'</span>'+(wa&&x.status==="ja"?'<a class="cal" href="'+outlookUrl(x)+'" target="_blank" rel="noopener" aria-label="Zet in Outlook" title="Zet in Outlook">'+CAL+'</a>':'')+(wa?'<a class="wa" href="'+waUrl(x,x.status==="ja"?"remind":"")+'" target="_blank" rel="noopener" aria-label="'+(x.status==="ja"?"Herinnering":"WhatsApp")+' naar '+esc(x.naam)+'" title="'+(x.status==="ja"?"Stuur herinnering":"Stuur WhatsApp")+'">'+WAI+'</a>':'')+'<button class="del" type="button" data-mdel="'+esc(x.id)+'" aria-label="Verwijderen">'+BIN+'</button></div>';
  $("meiDone").innerHTML=done.length?done.map(x=>row(x,true)).join(""):'<div style="color:var(--muted);font-size:14px">Nog niets afgesproken.</div>';
  $("meiPast").innerHTML=past.length?past.slice(0,30).map(x=>row(x,false)).join(""):'<div style="color:var(--muted);font-size:14px">Nog niets.</div>';
}
async function setMei(id,status){
  try{
    await fresh();
    const r=await fetch(MEI+"?id=eq."+id,{method:"PATCH",headers:Object.assign({"Content-Type":"application/json",Prefer:"return=representation"},authH()),body:JSON.stringify({status})});
    if(!r.ok) throw 0;
    const got=await r.json();
    if(!got.length){say("meiMsg","Niets aangepast. Heb je de SQL voor meisporten uitgevoerd?");return}
    mei=mei.map(x=>x.id===id?Object.assign({},x,{status}):x); renderMei();
    say("meiMsg","");
    const x=mei.find(m=>m.id===id);
    $("meiWaTop").innerHTML=x?'<div class="box"><span style="color:var(--accent);font-size:14px">'+(status==="ja"?"Afgesproken! Staat nu op de volgpagina.":"Doorgegeven: past niet.")+'</span><a class="wabtn" href="'+waUrl(x)+'" target="_blank" rel="noopener">'+WAI+'Stuur '+esc(String(x.naam).trim().split(" ")[0])+' een WhatsApp</a>'+(status==="ja"?'<div class="calbtns"><a href="'+outlookUrl(x)+'" target="_blank" rel="noopener">'+CAL+'Zet in Outlook</a><a href="'+icsUrl(x)+'" download="stoker-'+x.datum+'.ics">'+CAL+'Agendabestand</a></div>':'')+'</div>':'';
  }catch(e){ say("meiMsg","Aanpassen mislukt. Probeer het opnieuw."); }
}
async function delMei(id){
  const x=mei.find(m=>m.id===id);
  if(!confirm("Aanbod van "+(x?x.naam:"deze persoon")+" verwijderen?"))return;
  try{
    await fresh();
    const r=await fetch(MEI+"?id=eq."+id,{method:"DELETE",headers:Object.assign({Prefer:"return=representation"},authH())});
    if(!r.ok) throw 0;
    const gone=await r.json(); if(!gone.length){say("meiMsg","Niets verwijderd.");return}
    mei=mei.filter(m=>m.id!==id); renderMei(); say("meiMsg","Verwijderd.",true);
  }catch(e){ say("meiMsg","Verwijderen mislukt."); }
}
$("panMei").addEventListener("click",e=>{
  const s=e.target.closest("[data-set]"); if(s){setMei(s.dataset.id,s.dataset.set);return}
  const d=e.target.closest("[data-mdel]"); if(d) delMei(d.dataset.mdel);
});
const tab=w=>{[["gok","Gok"],["mei","Mei"],["dn","Dn"]].forEach(([k,id])=>{$("tab"+id).setAttribute("aria-selected",String(k===w));$("pan"+id).hidden=k!==w});try{sessionStorage.setItem("stoker-tab",w)}catch(e){}};
$("tabGok").addEventListener("click",()=>tab("gok"));
$("tabMei").addEventListener("click",()=>tab("mei"));
$("tabDn").addEventListener("click",()=>tab("dn"));
try{const t=sessionStorage.getItem("stoker-tab");if(t==="mei"||t==="dn")tab(t)}catch(e){}

// ===== deelnemers kompetysje =====
const KLEUREN=["#ff8fb1","#4da3ff","#ffd23f","#ff7a2f","#b48cff","#9be15d","#5fe0e6","#ff5f5f","#f0e6d2","#c58b5a"]; // dielnimmers kieze sels; dit is allinne de begjinkleur
let dn=[], dnKleur=KLEUREN[0];
const rpc=async(f,body)=>{await fresh();const r=await fetch(SB+"/rest/v1/rpc/"+f,{method:"POST",headers:Object.assign({"Content-Type":"application/json"},authH()),body:JSON.stringify(body||{})});
  const j=await r.json().catch(()=>null); if(r.status===401){S=null;save();show();throw new Error("uit")} if(!r.ok) throw new Error((j&&j.message)||"fout"); return j};
const uitnodiging=(naam,tok)=>"Hoi "+naam+"! Doch mei oan de Stoker-kompetysje 💪 Wa rekket it measte kwyt (yn prosinten, kilo's sjocht nimmen)?\n\nKies hjir dyn wachtwurd:\nhttps://stokernei100.nl/ynfolle.html#u="+tok+"\n\nDe link wurket 14 dagen. Dêrnei folst elke woansdei dyn gewicht yn op stokernei100.nl/ynfolle (ynlogge mei dyn namme en wachtwurd).\nStoker";
const toonWa=(naam,tok)=>{$("dnWa").innerHTML='<div class="box" style="display:grid;gap:10px"><span style="color:var(--accent);font-size:14px">Uitnodiging voor '+esc(naam)+' klaar.</span><a class="wabtn" href="https://wa.me/?text='+encodeURIComponent(uitnodiging(naam,tok))+'" target="_blank" rel="noopener">'+WAI+'Stuur '+esc(naam)+' de link via WhatsApp</a></div>'};
async function loadDn(){
  try{ dn=await rpc("dn_beheer_list"); renderDn(); say("dnMsg",""); }
  catch(e){ if(e.message!=="uit") say("dnMsg","Laden mislukt. Heb je de SQL voor de kompetysje uitgevoerd?"); }
}
function renderDn(){
  $("tabDn").textContent="Deelnemers"+(dn.length?" · "+dn.length:"");
  $("dnList").innerHTML=dn.length?dn.map(x=>{
    const st=!x.aktyf?"Gepauzeerd":x.wachtwurd?(x.wegingen?x.wegingen+(x.wegingen===1?" weging":" wegingen")+" · laatste "+fd(x["lêste"]):"Doet mee, nog geen weging"):x.utnoege?"Uitgenodigd, nog geen wachtwoord":"Link verlopen";
    return '<div class="dn'+(x.aktyf?'':' uit')+'"><span class="dot" style="background:'+esc(x.kleur)+'">'+esc(String(x.namme)[0].toUpperCase())+'</span><div><b>'+esc(x.namme)+'</b><small>'+esc(st)+'</small></div>'+
      '<button type="button" class="wa" data-link="'+esc(x.id)+'" aria-label="Nieuwe link voor '+esc(x.namme)+'" title="Nieuwe link / wachtwoord vergeten">'+WAI+'</button>'+
      '<button type="button" class="mini" data-aktyf="'+esc(x.id)+'" data-aan="'+(!x.aktyf)+'">'+(x.aktyf?"Pauze":"Actief")+'</button>'+
      '<button type="button" class="del" data-dndel="'+esc(x.id)+'" aria-label="'+esc(x.namme)+' verwijderen">'+BIN+'</button></div>'}).join(""):'<div class="empty">Nog geen deelnemers. Voeg hierboven iemand toe.</div>';
}
$("dnForm").addEventListener("submit",async e=>{
  e.preventDefault(); const naam=$("dnNaam").value.trim(); if(!naam)return; $("dnAdd").disabled=true;
  try{ const fr=KLEUREN.filter(c=>!dn.some(x=>x.kleur===c)); dnKleur=fr.length?fr[0]:KLEUREN[dn.length%KLEUREN.length];
    const r=await rpc("dn_beheer_nij",{namme:naam,kleur:dnKleur}); $("dnNaam").value=""; toonWa(naam,r.token); await loadDn(); }
  catch(err){ if(err.message!=="uit") say("dnMsg","Toevoegen mislukt."); }
  $("dnAdd").disabled=false;
});
$("dnList").addEventListener("click",async e=>{
  const l=e.target.closest("[data-link]"), a=e.target.closest("[data-aktyf]"), d=e.target.closest("[data-dndel]");
  try{
    if(l){const x=dn.find(y=>y.id===l.dataset.link); if(x.wachtwurd&&!confirm("Nieuwe link voor "+x.namme+"? Het oude wachtwoord blijft werken tot "+x.namme+" een nieuw kiest, maar ingelogde telefoons worden uitgelogd."))return;
      const t=await rpc("dn_beheer_utnoegje",{id:x.id}); toonWa(x.namme,t); scrollTo({top:0,behavior:"smooth"}); await loadDn();}
    if(a){await rpc("dn_beheer_aktyf",{id:a.dataset.aktyf,aan:a.dataset.aan==="true"}); await loadDn();}
    if(d){const x=dn.find(y=>y.id===d.dataset.dndel); if(!confirm(x.namme+" en al zijn gegevens verwijderen?"))return; await rpc("dn_beheer_wiskje",{id:x.id}); $("dnWa").innerHTML=""; await loadDn(); say("dnMsg","Verwijderd.",true);}
  }catch(err){ if(err.message!=="uit") say("dnMsg","Dat lukte niet. Probeer het opnieuw."); }
});

function show(){
  $("login").hidden=!!S; $("app").hidden=!S;
  if(S){ $("who").textContent="Ingelogd als "+(S.email||"beheerder"); load(); loadMei(); loadDn(); }
}
show();
</script>
</body>
