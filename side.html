<!doctype html>
<html lang="fy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Kompetysje · Stoker nei 100</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#121212;--band:#1e1e1e;--line:#2c2c2c;--fg:#fff;--soft:#ddd;--muted:#aaa;--accent:#3ef0c0;--c:#3ef0c0;--empty:#2a2a2a;--gold:#ffd23f;
  --f-display:Anton,Impact,"Arial Narrow",sans-serif;--f-body:"Work Sans",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
section{padding-block:24px;border-bottom:1px solid var(--line)}
h2{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:28px;line-height:1;margin:0 0 14px;display:flex;align-items:center;gap:12px}
h2::before{content:"";width:5px;height:24px;border-radius:3px;background:var(--c);flex:none}
.held{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.held h1{font-family:var(--f-display);font-weight:400;text-transform:uppercase;font-size:clamp(44px,14vw,64px);line-height:.92;margin:0;overflow-wrap:anywhere}
.av{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#121212;font-weight:600;font-size:30px}
.meta{color:var(--muted);font-size:14px;margin:10px 0 0}
.grut{display:flex;align-items:baseline;gap:12px;margin-top:18px}
.grut b{font-family:var(--f-display);font-weight:400;font-size:clamp(72px,26vw,110px);line-height:.9;color:var(--c)}
.grut span{font-size:16px;color:var(--soft);line-height:1.2}
.bar{height:8px;background:var(--empty);border-radius:4px;overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;background:var(--c);border-radius:4px}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.tal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tal div{background:var(--band);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.tal b{display:block;font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1}
.tal span{font-size:12px;color:var(--muted)}
.wk{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.wk span{color:var(--muted)}
.wk em{font-style:normal;font-weight:600;color:var(--c);min-width:56px;text-align:right}
.wk small{color:var(--muted);font-size:13px;min-width:56px;text-align:right}
.wknav{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px}
.wknav b{text-align:center;font-size:16px;font-weight:600;line-height:1.2}
.wknav b small{display:block;font-size:13px;font-weight:400;color:var(--muted)}
.wknav button{height:40px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:20px;cursor:pointer}
.wknav button:disabled{opacity:.3;cursor:default}
.wkslider{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin-top:10px;overscroll-behavior-x:contain}
.wkslider::-webkit-scrollbar{display:none}
.wkslide{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always}
.mkal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mkal b{font-size:11px;font-weight:600;color:var(--muted);text-align:center;text-transform:uppercase;padding-bottom:2px}
.mkal i{position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:6px;background:var(--empty);font-style:normal;font-size:14px;font-weight:600;color:var(--soft);font-variant-numeric:tabular-nums}
.mkal i small{position:absolute;right:2px;bottom:1px;font-size:9px;line-height:1}
.mkal i.l1{background:color-mix(in srgb,var(--c) 35%,var(--empty));color:var(--fg)}
.mkal i.l2{background:color-mix(in srgb,var(--c) 70%,var(--empty));color:#121212}
.mkal i.l3{background:var(--c);color:#121212}
.mkal i.tak{background:transparent;outline:1px dashed var(--line);outline-offset:-1px;color:#777}
.mkal i.hj{box-shadow:0 0 0 2px var(--fg)}
.kal-leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.kal-leg span{display:inline-flex;align-items:center;gap:6px}
.kal-leg i{display:inline-block;width:12px;height:12px;border-radius:3px}
.kal{overflow-x:auto;padding-bottom:4px}
.kal-g{display:grid;grid-auto-flow:column;grid-template-rows:14px repeat(7,auto);gap:4px;width:max-content}
.kal-g i{display:block;width:100%;aspect-ratio:1;border-radius:3px;background:var(--empty)}
.kal-g em{font-style:normal;font-size:10px;color:var(--muted);white-space:nowrap;width:0;line-height:14px}
.kal-g b{font-weight:400;font-size:10px;color:var(--muted);align-self:center}
.note{font-size:14px;color:var(--muted);margin:12px 0 0}
.empty{border:1px dashed var(--line);border-radius:8px;padding:14px;color:var(--muted);font-size:15px}
.kop{position:sticky;top:0;z-index:10;background:rgba(18,18,18,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px))}
.kop a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px 0 10px;border:1px solid var(--line);border-radius:22px;background:var(--band);color:var(--fg);font:600 15px var(--f-body);text-decoration:none}
.kop a svg{width:18px;height:18px;color:var(--accent)}
.kop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kop a.fol{background:var(--accent);border-color:var(--accent);color:#06261e}
.kop a.fol svg{color:#06261e}
.terug{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:24px;min-height:50px;border-radius:8px;background:var(--accent);color:#06261e;font:600 16px var(--f-body);text-decoration:none}
.terug svg{width:18px;height:18px}
</style>
</head>
<body>
<nav class="kop"><a href="https://stokernei100.nl/#kompetysje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Klassemint</a><a class="fol" href="ynfolle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>Myn wike ynfolle</a></nav>
<main>
  <div id="laden" class="empty" style="margin-top:20px">Even laden…</div>
  <div id="side" hidden>
    <div class="held"><div><h1 id="namme"></h1><p class="meta" id="meta"></p></div><div class="av" id="av"></div></div>
    <div class="grut"><b id="pct">0%</b><span>kwyt sûnt<br>de start</span></div>
    <div class="bar"><i id="balk" style="width:0"></i></div>
    <div class="ends"><span>start</span><span id="doel"></span></div>
    <section>
      <div class="tal">
        <div><b id="tT">0</b><span>trainingen</span></div>
        <div><b id="tS">0</b><span>dagen 10.000 stappen</span></div>
        <div><b id="tW">0</b><span>wegingen</span></div>
      </div>
    </section>
    <section><h2>Alle wegingen</h2><div id="wiken"></div></section>
    <section><h2>Kalinder</h2>
      <div class="wknav"><button type="button" id="kalPrev" aria-label="Foarige moanne">‹</button><b id="kalKop"></b><button type="button" id="kalNext" aria-label="Folgjende moanne">›</button></div>
      <div class="wkslider" id="kal" role="img"></div>
      <div class="kal-leg"><span><i style="background:var(--empty)"></i>neat</span><span><i style="background:color-mix(in srgb,var(--c) 35%,var(--empty))"></i>10.000 stappen</span><span><i style="background:color-mix(in srgb,var(--c) 70%,var(--empty))"></i>sporte</span><span><i style="background:var(--c)"></i>allebeide</span></div>
      <p class="note">Hoe griener, hoe better. Skow opsij foar oare moannen.</p></section>
  </div>
  <a class="terug" href="https://stokernei100.nl/#kompetysje"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Werom nei it klassemint</a>
</main>
<script src="kompetysje.js"></script>
<script>
(()=>{
  const $=id=>document.getElementById(id);
  const nl=(n,d=1)=>Number(n).toLocaleString("nl-NL",{minimumFractionDigits:d,maximumFractionDigits:d});
  const FM=["jan","feb","mrt","apr","mai","jun","jul","aug","sep","okt","nov","des"], FL=["jannewaris","febrewaris","maart","april","maaie","juny","july","augustus","septimber","oktober","novimber","desimber"];
  const pd=s=>{const [y,m,d]=String(s).slice(0,10).split("-").map(Number);return new Date(y,m-1,d)};
  const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  const sl=new URLSearchParams(location.search).get("n")||"";
  if(sl==="stoker"){ location.replace("https://stokernei100.nl/"); return; }
  StokerKomp.laad().then(k=>{
    const r=k.rows.find(x=>x.slug===sl);
    if(!r){ $("laden").textContent="Dizze dielnimmer bestiet net (mear)."; return; }
    document.documentElement.style.setProperty("--c",r.kleur);
    document.title=r.namme+" · Stoker nei 100";
    $("namme").textContent=r.namme; $("av").textContent=r.namme[0].toUpperCase();
    const mei=k.rows.filter(x=>x.pct!=null), plak=mei.findIndex(x=>x.slug===sl)+1;
    $("meta").textContent=r.start?("Docht mei sûnt "+pd(r.start).getDate()+" "+FL[pd(r.start).getMonth()]+(plak?" · plak "+plak+" fan "+mei.length:"")):"Begjint by de earste weging";
    const p=r.pct||0; $("pct").textContent=(r.pct==null?"0":(p<0?"+":"")+nl(Math.abs(p)))+"%";
    $("balk").style.width=Math.max(0,Math.min(100,p/r.doel*100))+"%"; $("doel").textContent="doel: "+nl(r.doel,r.doel%1?1:0)+"% kwyt";
    $("tT").textContent=r.trainingen; $("tS").textContent=r.stappen; $("tW").textContent=r.wiken.length;
    // wiken (nijste boppe)
    const w=r.wiken.slice();
    $("wiken").innerHTML=w.length?w.map((x,i)=>{const d=pd(x[0]);const v=i?r1(x[1]-w[i-1][1]):null;return '<div class="wk"><b>'+(i?"Weging "+(i+1):"Start")+'</b><span>'+d.getDate()+" "+FM[d.getMonth()]+'</span><small>'+(v==null?"":(v>0?"−":v<0?"+":"±")+nl(Math.abs(v))+"%")+'</small><em>'+(i?(x[1]>0?"−":x[1]<0?"+":"")+nl(Math.abs(x[1]))+"%":"0%")+'</em></div>'}).reverse().join(""):'<div class="empty">Noch gjin wegingen.</div>';
    // kalinder: per moanne, fan de earste aktive moanne oant no
    const dm={}; r.dagen.forEach(x=>dm[x[0]]=x);
    const t=new Date(); t.setHours(0,0,0,0); const hj=iso(t);
    const keys=[r.start,...r.dagen.map(x=>x[0])].filter(Boolean).sort();
    const b0=keys.length?pd(keys[0]):new Date(t); b0.setDate(1);
    const ML=["jannewaris","febrewaris","maart","april","maaie","juny","july","augustus","septimber","oktober","novimber","desimber"];
    const moannen=[]; for(let d=new Date(b0); d<=t||(d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth()); d.setMonth(d.getMonth()+1)) moannen.push(new Date(d));
    $("kal").innerHTML=moannen.map(m=>{
      let h='<div class="wkslide"><div class="mkal">'+["mo","ti","wo","to","fr","so","sn"].map(x=>'<b>'+x+'</b>').join("");
      for(let i=0;i<(m.getDay()+6)%7;i++) h+='<span></span>';
      const n=new Date(m.getFullYear(),m.getMonth()+1,0).getDate();
      for(let dd=1;dd<=n;dd++){const d=new Date(m.getFullYear(),m.getMonth(),dd),k=iso(d),x=dm[k],fut=d>t,l=fut||!x?0:(x[1]?2:0)+(x[2]?1:0);
        h+='<i class="'+(fut?"tak":l?"l"+l:"")+(k===hj?" hj":"")+'">'+dd+(x&&x[1]&&!fut?'<small>💪</small>':'')+'</i>';}
      return h+'</div></div>'}).join("");
    $("kal").setAttribute("aria-label","Kalinder fan "+r.namme+": "+r.trainingen+" trainingen, "+r.stappen+" dagen 10.000 stappen");
    let mI=moannen.length-1;
    const kop=()=>{const m=moannen[mI];$("kalKop").innerHTML=ML[m.getMonth()]+'<small>'+m.getFullYear()+'</small>';$("kalPrev").disabled=mI===0;$("kalNext").disabled=mI>=moannen.length-1};
    const ga=(i,glad)=>{mI=i;kop();$("kal").scrollTo({left:i*$("kal").clientWidth,behavior:glad&&!matchMedia("(prefers-reduced-motion: reduce)").matches?"smooth":"auto"})};
    $("kal").addEventListener("scroll",()=>{const i=Math.round($("kal").scrollLeft/Math.max(1,$("kal").clientWidth));if(i!==mI&&moannen[i]){mI=i;kop()}},{passive:true});
    $("kalPrev").addEventListener("click",()=>{if(mI>0)ga(mI-1,true)});
    $("kalNext").addEventListener("click",()=>{if(mI<moannen.length-1)ga(mI+1,true)});
    $("laden").hidden=true; $("side").hidden=false; ga(mI,false);
  }).catch(()=>{ $("laden").textContent="Laden mislearre. Ferfarskje de side."; });
  function r1(n){return Math.round(n*10)/10}
})();
</script>
</body>
</html>
