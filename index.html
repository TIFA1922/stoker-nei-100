<!doctype html>
<html lang="fy">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stoker nei 100</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: één donkere kolom (telefoon), banden met dunne lijnen ertussen: kop met kilo's kwijt, drie getallen, grafiek, weekkaartjes, dizze wike */
:root{
  --bg:#121212; --band:#1e1e1e; --line:#2c2c2c; --fg:#ffffff; --soft:#dddddd; --muted:#aaaaaa; --dim:#777777;
  --accent:#3ef0c0; --up:#ffb27a; --empty:#2a2a2a;
  --f-display:Anton,Impact,"Arial Narrow Bold",sans-serif;
  --f-body:"Work Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.45}
.page{max-width:560px;margin:0 auto}
.band{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:24px;border-bottom:1px solid var(--line);display:grid;gap:14px}
.disp{font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:.01em;margin:0}
h1.disp{font-size:clamp(46px,14vw,64px);line-height:.92}
h2.disp{font-size:26px;line-height:1}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.when{font-size:13px;color:var(--muted);text-align:right;padding-top:6px}
.big{display:flex;align-items:baseline;gap:12px}
.big b{font-family:var(--f-display);font-weight:400;font-size:clamp(84px,28vw,120px);line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.big span{font-size:16px;color:var(--soft)}
.ticks{display:grid;grid-template-columns:repeat(30,minmax(0,1fr));gap:2px}
.ticks button{height:22px;border:0;padding:0;margin:0;background:var(--empty);cursor:pointer;border-radius:1px}
.ticks button.on{background:var(--accent)}
.ticks button.ms{box-shadow:inset 0 0 0 2px var(--fg)}
.ticks button.sel{outline:2px solid var(--fg);outline-offset:2px}
.ticks button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tick-info{margin:0;font-size:14px;color:var(--soft);background:var(--band);border-radius:6px;padding:10px 12px}
.tick-info b{color:var(--fg)}
.ms-line{font-size:14px;color:var(--soft);margin:0}
.ms-line b{font-family:var(--f-display);font-weight:400;font-size:18px;color:var(--fg);letter-spacing:.01em}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid var(--line)}
.stat{padding:18px 12px;display:grid;gap:2px;border-right:1px solid var(--line);min-width:0}
.stat:first-child{padding-left:max(20px,env(safe-area-inset-left,0px))}
.stat:last-child{border-right:0}
.stat b{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,8vw,32px);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.note{font-size:12px;color:var(--muted);margin:0}
.weeks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.wk{background:var(--band);border-radius:6px;padding:12px 10px;display:grid;gap:4px}
.wk span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wk b{font-family:var(--f-display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.wk em{font-style:normal;font-size:12px;color:var(--accent)}
.wk em.up{color:var(--up)}
.wk small{font-size:11px;color:var(--muted)}
.story{margin:0;font-size:16px;line-height:1.5;color:var(--soft)}
.empty{padding:14px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:15px}
.compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.compare figure{margin:0;display:grid;gap:4px}
.compare figcaption{font-size:12px;color:var(--muted)}
.ph{position:relative;width:100%;overflow:hidden;border-radius:6px;background:var(--band)}
.ph img{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;width:100%;height:100%}
.ov polyline{fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.ov .halo{stroke:rgba(0,0,0,.55);stroke-width:4.5}
.ov .ln{stroke:var(--accent);stroke-width:2.2;stroke-dasharray:7 5}
.goals{display:grid;gap:8px}
.goal{background:var(--band);border-radius:6px;border:1px solid var(--line)}
.goal[open]{border-color:var(--accent)}
.goal summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px}
.goal summary::-webkit-details-marker{display:none}
.goal summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.goal .kg{font-family:var(--f-display);font-size:28px;line-height:1;min-width:52px}
.goal .what{display:grid;gap:2px;min-width:0}
.goal .what b{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap;min-width:0}
.goal .ico{width:20px;height:20px;color:var(--accent);flex:none}
.goal .what span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal summary{min-height:72px}
@media (max-width:380px){.goal summary{gap:10px;padding:12px}.goal .kg{font-size:24px;min-width:44px}.pill{padding:4px 8px;font-size:11px}}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--empty);color:var(--soft);white-space:nowrap}
.pill.ok{background:var(--accent);color:#06261e}
.goal .more{padding:0 14px 14px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.goal .more div{display:grid;gap:2px}
.goal .more b{font-family:var(--f-display);font-weight:400;font-size:22px}
.goal .more span{font-size:12px;color:var(--muted)}
.goal .tip{grid-column:1 / -1;font-size:14px;color:var(--soft);margin:0}
footer{padding:20px max(20px,env(safe-area-inset-left,0px)) 32px;font-size:12px;color:var(--dim)}
</style>
</head>
<body style="margin:0">


<div class="page">
  <section class="band">
    <div class="top">
      <h1 class="disp">Stoker<br>nei 100</h1>
      <div class="when" id="when">Start<br>21 oktober</div>
    </div>
    <div class="big"><b id="lost">0,0</b><span>kilo<br>kwyt</span></div>
    <div>
      <div class="ticks" id="ticks" role="group" aria-label="30 kilo, tik op in blûkje"></div>
      <div class="ends" style="margin-top:6px"><span id="startLbl">130</span><span id="goalLbl">100</span></div>
    </div>
    <p class="tick-info" id="tickInfo" hidden></p>
    <p class="ms-line" id="msLine"></p>
  </section>

  <section class="band">
    <h2 class="disp">Doelen</h2>
    <div class="goals" id="goals"></div>
  </section>

  <div class="stats">
    <div class="stat"><b id="left">30,0</b><span>noch te gean</span></div>
    <div class="stat"><b id="train">0</b><span>trainingen</span></div>
    <div class="stat"><b id="dl">–</b><span>kg deadlift</span></div>
  </div>

  <section class="band">
    <h2 class="disp">Gewicht</h2>
    <div id="chart"></div>
    <p class="note" id="chartNote">Stippellyn: it plan fan sa'n 1 kilo yn 'e wike.</p>
  </section>

  <section class="band">
    <h2 class="disp">Alle wiken</h2>
    <div id="weeks"></div>
  </section>

  <section class="band" id="storyBand">
    <h2 class="disp">Dizze wike</h2>
    <p class="story" id="story"></p>
  </section>

  <section class="band" id="photoBand" hidden>
    <h2 class="disp">Begjin en no</h2>
    <div id="photos"></div>
  </section>

  <footer id="foot">Elke woansdei in update.</footer>
</div>

<script type="application/json" id="data">{"updated":null,"start":130,"goal":100,"weights":[],"weeks":[],"deadlift":[],"note":"","photos":[],"contour":null}</script>
<script>
(() => {
const MONTHS=["jannewaris","febrewaris","maart","april","maaie","juny","july","augustus","septimber","oktober","novimber","desimber"];
const $=id=>document.getElementById(id);
let D; try{D=JSON.parse($("data").textContent)}catch(e){D={start:130,goal:100}}
const pd=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const fmt=(n,d=1)=>n==null?"–":Math.abs(n).toLocaleString("nl-NL",{minimumFractionDigits:d,maximumFractionDigits:d});
const fd=s=>{const d=pd(s);return d.getDate()+" "+MONTHS[d.getMonth()]};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const ws=(D.weights||[]).slice().sort((a,b)=>a[0]<b[0]?-1:1);
const start=D.start||130, goal=D.goal||100, cur=ws.length?ws[ws.length-1][1]:start;
const lost=Math.max(0,start-cur), left=Math.max(0,cur-goal), total=start-goal;
const weekNo=ws.length?Math.max(0,Math.round((pd(ws[ws.length-1][0])-pd(ws[0][0]))/(7*864e5))):0;

$("lost").textContent=(lost>0?"−":"")+fmt(lost);
$("left").textContent=fmt(left);
$("startLbl").textContent=fmt(start,0); $("goalLbl").textContent=fmt(goal,0);
const on=Math.min(30,Math.round(lost/total*30));
const MSS=[{kg:120,goal:"ûnder de 120 kilo",when:"op myn jierdei (13 april)",done:c=>c<120},{kg:110,goal:"110 kilo",when:"mei de bouwfak (24 july)",done:c=>c<=110}];
const msIdx=MSS.map(m=>Math.round((start-m.kg)/total*30)-1);
$("ticks").innerHTML=Array.from({length:30},(_,i)=>{const c=[];if(i<on)c.push("on");if(msIdx.includes(i))c.push("ms");return '<button type="button" data-k="'+i+'" aria-label="Kilo '+(i+1)+'"'+(c.length?' class="'+c.join(" ")+'"':'')+'></button>'}).join("");
const next=MSS.find(m=>!m.done(cur)), hit=MSS.filter(m=>m.done(cur));
// klikbere doelen
(()=>{
  const ref=D.updated?pd(D.updated):new Date();
  const CAKE='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Jierdei"><path d="M4 21h16"/><path d="M5 21v-7a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v7"/><path d="M5 16c1.2 1 2.3 1 3.5 0s2.3-1 3.5 0 2.3 1 3.5 0 2.3-1 3.5 0"/><path d="M8 12V9M12 12V9M16 12V9"/><path d="M8 6.5c0-.8.6-1.5 0-2.5-.6 1-1 1.7 0 2.5zM12 6.5c0-.8.6-1.5 0-2.5-.6 1-1 1.7 0 2.5zM16 6.5c0-.8.6-1.5 0-2.5-.6 1-1 1.7 0 2.5z" fill="currentColor"/></svg>';
  const BEER='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Bouwfak"><path d="M6 8h10v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z"/><path d="M16 11h2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2h-2"/><path d="M6 8a2.5 2.5 0 0 1 1.5-4.6A3 3 0 0 1 13 3a2.5 2.5 0 0 1 3 2.6A2 2 0 0 1 16 8"/><path d="M9.5 12v6M12.5 12v6"/></svg>';
  const G=[{kg:120,title:"Ûnder de 120",icon:CAKE,sub:"13 april · feest de 18e",extra:"Op snein 18 april fier ik myn jierdei. Dan wol ik der stean op ûnder de 120!",date:"2027-04-13",target:119.9,done:cur<120},
           {kg:110,title:"110 kilo",icon:BEER,sub:"Bouwfak · 24 july",date:"2027-07-24",target:110,done:cur<=110},
           {kg:goal,title:fmt(goal,0)+" kilo",sub:"Einddoel",date:null,target:goal,done:cur<=goal}];
  const firstOpen=G.findIndex(g=>!g.done);
  $("goals").innerHTML=G.map((g,i)=>{
    const left=Math.max(0,cur-g.target), wks=g.date?Math.max(0,Math.ceil((pd(g.date)-ref)/(7*864e5))):null;
    const per=wks?left/wks:null;
    let tip;
    if(g.done) tip="Helle! Op nei it folgjende doel.";
    else if(wks===0) tip="De datum is foarby. Gjin punt: hâld it tempo fêst.";
    else if(per!=null) tip=per<=0.5?"Rom op skema. Dit is goed te dwaan, ek mei in pear minder wiken.":per<=0.9?"Op skema as it tempo bliuwt sa't it no is.":"Krap. Elke wike telt, mar it kin noch.";
    else tip="Mei sa'n 1 kilo yn 'e wike bist der yn likernôch "+Math.ceil(left)+" wiken.";
    const cells=g.done?'':'<div><b>'+fmt(left)+'</b><span>kilo noch</span></div>'+(wks!=null?'<div><b>'+wks+'</b><span>wiken noch</span></div><div><b>'+fmt(per)+'</b><span>kilo yn \'e wike</span></div>':'');
    return '<details class="goal" name="doelen" id="goal'+i+'"><summary><span class="kg">'+g.kg+'</span><span class="what"><b>'+g.title+(g.icon||'')+'</b><span>'+g.sub+'</span></span><span class="pill'+(g.done?' ok':'')+'">'+(g.done?'Helle':'Noch '+fmt(left)+' kg')+'</span></summary><div class="more">'+cells+(g.extra?'<p class="tip">'+g.extra+'</p>':'')+'<p class="tip">'+tip+'</p></div></details>';
  }).join("");
})();
// ien doel tagelyk iepen
document.querySelectorAll("#goals details").forEach(d=>d.addEventListener("toggle",()=>{if(d.open)document.querySelectorAll("#goals details").forEach(o=>{if(o!==d)o.open=false})}));
// klikbere blûkjes
$("ticks").addEventListener("click",e=>{
  const b=e.target.closest("button[data-k]"); if(!b)return;
  const k=+b.dataset.k, step=total/30, from=start-k*step, to=start-(k+1)*step;
  let gi=msIdx.indexOf(k); if(k===29)gi=2;
  document.querySelectorAll("#ticks button.sel").forEach(x=>x.classList.remove("sel")); b.classList.add("sel");
  $("tickInfo").hidden=false;
  $("tickInfo").innerHTML='<b>Kilo '+(k+1)+' fan 30</b> · fan '+fmt(from)+' nei '+fmt(to)+' kg · '+(k<on?'helle':'noch te dwaan')+(gi>=0?' · '+['tuskendoel jierdei','tuskendoel bouwfak','einddoel'][gi]:'');
  if(gi>=0){const d=$("goal"+gi); if(d){d.open=true; d.scrollIntoView({behavior:"smooth",block:"nearest"})}}
});
$("msLine").innerHTML=(hit.length?'<b>Helle:</b> '+hit.map(m=>m.goal).join(", ")+'. ':'')+(next?'<b>Tuskendoel: '+next.goal+'</b> '+next.when+'. Noch '+fmt(Math.max(0,cur-(next.kg===120?119.9:next.kg)))+' kilo.':'');
$("when").innerHTML=ws.length&&weekNo>0?"Wike "+weekNo+"<br>"+fd(ws[ws.length-1][0]):"Start<br>"+(ws.length?fd(ws[0][0]):"21 oktober");

const wk=D.weeks||[]; const tot=wk.reduce((a,w)=>a+(w[1]||0),0);
$("train").textContent=wk.length?tot+"/"+(wk.length*5):"0";
const dl=(D.deadlift||[]).slice().sort((a,b)=>a[0]<b[0]?-1:1);
$("dl").textContent=dl.length?fmt(dl[dl.length-1][1],dl[dl.length-1][1]%1?1:0):"–";

// grafiek
if(ws.length>=2){
  const W=350,H=160,T=12,B=22;
  const t=ws.map(p=>pd(p[0]).getTime()), x0=t[0], x1=Math.max(t[t.length-1],x0+21*864e5);
  const ys=ws.map(p=>p[1]).concat([start]); const y0=Math.min(...ys)-1.5, y1=Math.max(...ys)+1;
  const X=v=>(v-x0)/(x1-x0)*W, Y=v=>T+(y1-v)/(y1-y0)*(H-T-B);
  const pe=Math.min(x1,x0+(start-goal)*7*864e5), pv=start-(pe-x0)/(7*864e5);
  const pts=ws.map((p,i)=>X(t[i]).toFixed(1)+","+Y(p[1]).toFixed(1)).join(" ");
  const lx=X(t[t.length-1]), ly=Y(ws[ws.length-1][1]);
  $("chart").innerHTML='<svg class="chart" viewBox="-6 0 '+(W+12)+' '+H+'" role="img" aria-label="Gewicht fan '+fmt(ws[0][1])+' nei '+fmt(cur)+' kilo">'+
    '<line x1="0" x2="'+W+'" y1="'+(H-B)+'" y2="'+(H-B)+'" stroke="var(--line)"/>'+
    '<line x1="0" y1="'+Y(start)+'" x2="'+X(pe)+'" y2="'+Y(pv)+'" stroke="#555" stroke-width="1.5" stroke-dasharray="5 5"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>'+
    '<circle cx="'+lx+'" cy="'+ly+'" r="5" fill="var(--accent)"/>'+
    '<text x="0" y="'+(H-6)+'">'+fd(ws[0][0])+'</text><text x="'+W+'" y="'+(H-6)+'" text-anchor="end">'+fd(ws[ws.length-1][0])+'</text>'+
    '<text x="'+Math.max(20,lx-8)+'" y="'+(ly-10)+'" text-anchor="end" style="fill:var(--fg)">'+fmt(cur)+'</text></svg>';
} else {
  $("chartNote").hidden=true;
  $("chart").innerHTML='<div class="empty">'+(ws.length?"Startgewicht stiet der yn. Nei de twadde weging ferskynt hjir de line.":"De earste weging is op woansdei 21 oktober.")+'</div>';
}

// weekkaartjes: per weging, nijste earst
if(ws.length){
  const cards=ws.map((w,i)=>{const d=i?w[1]-ws[i-1][1]:null;const n=Math.round((pd(w[0])-pd(ws[0][0]))/(7*864e5));
    const tr=wk.find(x=>Math.abs(pd(x[0])-pd(w[0]))<7*864e5&&pd(x[0])<=pd(w[0]));
    return '<div class="wk"><span>'+(n?"Wike "+n:"Start")+'</span><b>'+fmt(w[1])+'</b>'+
      (d==null?'<small>'+fd(w[0])+'</small>':'<em'+(d>0?' class="up"':'')+'>'+(d>0?"+":"−")+fmt(d)+' kg</em>')+'</div>'}).reverse();
  $("weeks").innerHTML='<div class="weeks">'+cards.join("")+'</div>';
} else $("weeks").innerHTML='<div class="empty">Elke woansdei komt der in kaartsje by.</div>';

// dizze wike
if(D.note){$("story").textContent=D.note}
else{$("story").textContent=ws.length?"":"Fan 130 nei 100 kilo. Fiif kear yn 'e wike traine en goed ite. Elke woansdei in update."; if(ws.length)$("storyBand").hidden=true}

// foto's (allinne as der dielde foto's binne)
const ph=(D.photos||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
if(ph.length){
  const ov=()=>D.contour&&D.contour.strokes?'<svg class="ov" viewBox="0 0 1 1" preserveAspectRatio="none" aria-hidden="true">'+D.contour.strokes.map(s=>'<polyline class="halo" points="'+esc(s)+'"/><polyline class="ln" points="'+esc(s)+'"/>').join("")+'</svg>':"";
  const box=(p,alt)=>'<div class="ph" style="aspect-ratio:'+(p.w&&p.h?p.w+" / "+p.h:"3 / 4")+'"><img src="'+p.img+'" alt="'+alt+'">'+ov()+'</div>';
  const a=ph[0],b=ph[ph.length-1];
  $("photos").innerHTML='<div class="compare"><figure>'+box(a,"Begjin")+'<figcaption>Begjin · '+fd(a.date)+'</figcaption></figure>'+(ph.length>1?'<figure>'+box(b,"No")+'<figcaption>No · '+fd(b.date)+'</figcaption></figure>':'')+'</div>';
  $("photoBand").hidden=false;
}

$("foot").textContent=D.updated?"Bywurke op "+fd(D.updated)+". Elke woansdei in update.":"De earste update komt op woansdei 21 oktober.";
})();
</script>

</body>
</html>
